services:
  app:
    build: .
    environment:
      COOKIE_SECURE: "1"
    volumes:
      - ticket_data:/app/data
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env con un subdominio real}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
volumes:
  ticket_data:
  caddy_data:
  caddy_config:
